name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC — npm trusted publishing (no NPM_TOKEN, no expiry, no secret)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: OIDC exchange probe (diagnostic - temporary)
        run: |
          curl -s -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=npm:registry.npmjs.org" -o /tmp/idtoken.json
          python3 -c "import json; print(json.load(open('/tmp/idtoken.json'))['value'])" > /tmp/idtoken.txt
          python3 -c "import base64,json; tok=open('/tmp/idtoken.txt').read().strip(); p=tok.split('.')[1]; p+='='*(-len(p)%4); c=json.loads(base64.urlsafe_b64decode(p)); print('workflow:', c.get('job_workflow_ref'))"
          echo "=== exchange ==="
          BODY=$(curl -s -X POST -H "Authorization: Bearer $(cat /tmp/idtoken.txt)" -H "Content-Type: application/json" "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/@emiltsoi%2fopenclaw-mesh" -d '{}')
          echo "$BODY" | python3 -c "import json,sys; d=json.load(sys.stdin); print('EXCHANGE SUCCESS - npm token minted (value masked)') if 'token' in d else print('EXCHANGE FAILED:', json.dumps(d)[:200])"

      - name: Publish to npm
        run: |
          # OIDC trusted publishing (end-state, 2026-08-16): token lane REMOVED —
          # the automation-token lane died on the 2FA policy (E403) and the
          # revoked-token secret shadowed the OIDC path (dead token -> anonymous
          # PUT -> 404). NPM_TOKEN secret deleted; npm CLI falls back to the
          # OIDC exchange when no NODE_AUTH_TOKEN is set (lib/utils/oidc.js).
          # --provenance retained (sigstore uses the GitHub OIDC env).
          # Idempotency: skip when this version is already published (re-dispatch safe).
          VER="$(node -p "require('./package.json').version")"
          if npm view "@emiltsoi/openclaw-mesh@${VER}" version >/dev/null 2>&1; then
            echo "openclaw-mesh@${VER} already on npm; skipping."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Publish to ClawHub
        env:
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_API_TOKEN" ]; then
            echo "CLAWHUB_API_TOKEN secret is not set; skipping ClawHub publish."
            exit 0
          fi
          npx -y clawhub@latest login --token "$CLAWHUB_API_TOKEN" --no-browser
          npx -y clawhub@latest package publish . \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}"
