name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC — npm trusted publishing (no NPM_TOKEN, no expiry, no secret)
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        run: |
          # Trusted publishing (OIDC) — no token. Requires npm-side mapping on npmjs.com
          # (package Settings → Access → Trusted publishing → emiltsoi/openclaw-mesh, publish.yml).
          # Idempotency: skip when this version is already published (re-dispatch safe).
          VER="$(node -p "require('./package.json').version")"
          if npm view "@emiltsoi/openclaw-mesh@${VER}" version >/dev/null 2>&1; then
            echo "openclaw-mesh@${VER} already on npm; skipping."
            exit 0
          fi
          npm publish --provenance --access public

      - name: Publish to ClawHub
        env:
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          if [ -z "$CLAWHUB_API_TOKEN" ]; then
            echo "CLAWHUB_API_TOKEN secret is not set; skipping ClawHub publish."
            exit 0
          fi
          npx -y clawhub@latest login --token "$CLAWHUB_API_TOKEN" --no-browser
          npx -y clawhub@latest package publish . \
            --source-repo "${{ github.repository }}" \
            --source-commit "${{ github.sha }}" \
            --source-ref "${{ github.ref_name }}"
