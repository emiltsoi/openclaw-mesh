name: Publish to npm and Clawhub

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public

      - name: Package plugin tarball
        run: npm pack

      - name: Publish to Clawhub
        env:
          CLAWHUB_URL: ${{ secrets.CLAWHUB_URL }}
          CLAWHUB_API_TOKEN: ${{ secrets.CLAWHUB_API_TOKEN }}
        run: |
          tarball=$(ls *.tgz)
          if [ -n "$CLAWHUB_URL" ] && [ -n "$CLAWHUB_API_TOKEN" ]; then
            curl -sfS -H "Authorization: Bearer $CLAWHUB_API_TOKEN" \
              -F "package=@$tarball" \
              "$CLAWHUB_URL/api/plugins/upload" || true
          fi
